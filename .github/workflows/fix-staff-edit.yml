name: Fix staff edit button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Auto-fix staff edit button') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore staff add delete controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          heading = '<h3 class="section-title" style="margin-top:18px">スタッフ情報</h3><div id="adminEmployees"></div>'
          heading_new = '<h3 class="section-title" style="margin-top:18px">スタッフ情報</h3><div class="row" style="margin-bottom:10px"><button id="addEmployeeBtn" class="primary" type="button">＋ スタッフを追加</button></div><div id="adminEmployees"></div>'
          if 'id="addEmployeeBtn"' not in s:
              if heading not in s:
                  raise SystemExit('staff heading not found')
              s = s.replace(heading, heading_new, 1)
          marker = '</script></body></html>'
          script = r'''<script>
(function(){
  async function staffAdminPost(path, body){
    const payload=Object.assign({},body||{}, {adminPin:adminPinValue});
    const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json().catch(function(){return {ok:false,message:'サーバー応答を読めませんでした。'};});
    if(!r.ok || !d.ok) throw new Error(d.message||'処理に失敗しました。');
    return d;
  }
  function ensureModal(){
    if(document.getElementById('addEmployeeModal')) return;
    const m=document.createElement('div');
    m.id='addEmployeeModal';
    m.className='modalback';
    m.innerHTML='<div class="modal"><h2>スタッフを追加</h2><div class="field"><label>名前</label><input id="newEmpName" type="text" maxlength="50" placeholder="例：鈴木"></div><div class="field"><label>時給（円）</label><input id="newEmpWage" type="number" min="0" step="1" value="0"></div><div class="field"><label>交通費（1勤務あたり・円）</label><input id="newEmpTransport" type="number" min="0" step="1" value="0"></div><div class="field"><label>PIN（4桁）</label><input id="newEmpPin" type="password" inputmode="numeric" maxlength="4" placeholder="例：5678"></div><div id="newEmpMsg" class="msg"></div><div class="row"><button id="saveNewEmployeeBtn" class="primary" type="button">追加する</button><button id="closeAddEmployeeBtn" class="secondary" type="button">キャンセル</button></div></div>';
    document.body.appendChild(m);
    document.getElementById('closeAddEmployeeBtn').addEventListener('click',function(){m.classList.remove('show');});
    document.getElementById('saveNewEmployeeBtn').addEventListener('click',async function(){
      const name=document.getElementById('newEmpName').value.trim();
      const wage=Math.max(0,Math.floor(Number(document.getElementById('newEmpWage').value||0)));
      const transport=Math.max(0,Math.floor(Number(document.getElementById('newEmpTransport').value||0)));
      const pin=document.getElementById('newEmpPin').value.trim();
      const msg=document.getElementById('newEmpMsg');
      if(!name){msg.textContent='名前を入力してください。';return;}
      if(!/^\d{4}$/.test(pin)){msg.textContent='PINは4桁の数字です。';return;}
      msg.textContent='追加中…';
      try{
        const d=await staffAdminPost('/api/admin/employee-create',{name:name,hourlyWage:wage,transportAllowance:transport,pin:pin});
        m.classList.remove('show');
        alert(d.message);
        await window.loadAdminEmployees();
        await loadEmployees();
      }catch(e){msg.textContent=e.message;}
    });
  }
  function renderStaff(){
    const box=document.getElementById('adminEmployees');
    if(!box || typeof adminEmployees==='undefined') return;
    const list=adminEmployees||[];
    box.innerHTML=list.map(function(e){
      const id=String(e.id||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      const name=String(e.name||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      return '<div class="admin-card"><b>'+name+'</b><div class="small">時給：'+Number(e.hourly_wage||0).toLocaleString()+'円　交通費：'+Number(e.transport_allowance||0).toLocaleString()+'円／勤務</div><div class="row" style="margin-top:8px"><button class="secondary editbtn staff-edit" type="button" data-id="'+id+'">編集</button><button class="danger editbtn staff-delete" type="button" data-id="'+id+'">削除</button></div></div>';
    }).join('');
    box.querySelectorAll('.staff-edit').forEach(function(btn){btn.addEventListener('click',function(){openEmployee(btn.getAttribute('data-id'));});});
    box.querySelectorAll('.staff-delete').forEach(function(btn){btn.addEventListener('click',async function(){
      const id=btn.getAttribute('data-id');
      const emp=list.find(function(x){return String(x.id)===id;});
      if(!emp)return;
      if(!confirm(emp.name+'さんをスタッフ一覧から削除しますか？\n\n過去の打刻履歴は残ります。'))return;
      try{const d=await staffAdminPost('/api/admin/employee-delete',{id:id});alert(d.message);await window.loadAdminEmployees();await loadEmployees();}catch(e){alert(e.message);}
    });});
  }
  function install(){
    ensureModal();
    const h=Array.from(document.querySelectorAll('.section-title')).find(function(x){return x.textContent.trim()==='スタッフ情報';});
    if(h && !document.getElementById('addEmployeeBtn')){
      const b=document.createElement('button');
      b.id='addEmployeeBtn';b.className='primary';b.type='button';b.textContent='＋ スタッフを追加';
      b.style.marginBottom='10px';
      h.insertAdjacentElement('afterend',b);
      b.addEventListener('click',function(){
        document.getElementById('newEmpName').value='';document.getElementById('newEmpWage').value='0';document.getElementById('newEmpTransport').value='0';document.getElementById('newEmpPin').value='';document.getElementById('newEmpMsg').textContent='';document.getElementById('addEmployeeModal').classList.add('show');setTimeout(function(){document.getElementById('newEmpName').focus();},50);
      });
    }
    if(typeof window.loadAdminEmployees==='function' && !window.loadAdminEmployees.__staffRestore){
      const original=window.loadAdminEmployees;
      const wrapped=async function(){const r=await original.apply(this,arguments);renderStaff();return r;};
      wrapped.__staffRestore=true;
      window.loadAdminEmployees=wrapped;
    }
    if(document.getElementById('adminEmployees') && typeof adminEmployees!=='undefined' && adminEmployees.length) renderStaff();
  }
  setTimeout(install,0);
  setInterval(install,1000);
})();
</script></body></html>'''
          if 'id="addEmployeeBtn"' not in s:
              raise SystemExit('staff add button insertion failed')
          if 'data-id=\'' not in s and 'staffAdminPost' not in s:
              s = s.replace(marker, script, 1)
          elif 'staffAdminPost' not in s:
              s = s.replace(marker, script, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Auto-fix staff edit button'
          git push
