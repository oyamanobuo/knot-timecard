name: Fix staff edit button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Auto-fix staff edit button') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch staff edit onclick
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'onclick=\\"openEmployee(${JSON.stringify(e.id)})\\"'
          new = 'onclick=\\"openEmployee(\\\'${e.id}\\\')\\"'
          if old not in s:
              raise SystemExit('target string not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Auto-fix staff edit button'
          git push
