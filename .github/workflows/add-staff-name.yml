name: Add staff name editing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Auto-fix staff name') && !contains(github.event.head_commit.message, 'Fix action buttons') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch staff name field and action buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')

          marker = '<div id="employeeModal" class="modalback"><div class="modal"><h2>スタッフ情報を編集</h2><div id="employeeInfo" class="notice"></div>'
          if 'id="empName"' not in s:
              if marker not in s:
                  raise SystemExit('employee modal marker not found')
              s = s.replace(marker, marker + '<div class="field"><label>名前</label><input id="empName" type="text" maxlength="50"></div>')

          old_open = 'function openEmployee(id){editingEmployee=adminEmployees.find(x=>x.id===id);if(!editingEmployee)return;$("employeeInfo").textContent=`${editingEmployee.name}さんの設定`;$("empWage").value=editingEmployee.hourly_wage||0;'
          new_open = 'function openEmployee(id){editingEmployee=adminEmployees.find(x=>x.id===id);if(!editingEmployee)return;$("employeeInfo").textContent=`${editingEmployee.name}さんの設定`;$("empName").value=editingEmployee.name||"";$("empWage").value=editingEmployee.hourly_wage||0;'
          if old_open in s:
              s = s.replace(old_open, new_open, 1)

          old_save = 'async function saveEmployee(){if(!editingEmployee)return;const wage=Math.max(0,Math.floor(Number($("empWage").value||0))),transport=Math.max(0,Math.floor(Number($("empTransport").value||0))),pin=$("empPin").value.trim();if(pin&&!/^\\d{4}$/.test(pin)){$("empMsg").textContent="PINは4桁の数字です。";return}$("empMsg").textContent="保存中…";try{const d=await adminPost("/api/admin/employee-update",{id:editingEmployee.id,hourlyWage:wage,transportAllowance:transport,pin});closeEmployeeModal();alert(d.message);await loadAdminEmployees()}catch(e){$("empMsg").textContent=e.message}}'
          new_save = 'async function saveEmployee(){if(!editingEmployee)return;const name=$("empName").value.trim(),wage=Math.max(0,Math.floor(Number($("empWage").value||0))),transport=Math.max(0,Math.floor(Number($("empTransport").value||0))),pin=$("empPin").value.trim();if(!name){$("empMsg").textContent="名前を入力してください。";return}if(pin&&!/^\\d{4}$/.test(pin)){$("empMsg").textContent="PINは4桁の数字です。";return}$("empMsg").textContent="保存中…";try{const d=await adminPost("/api/admin/employee-update",{id:editingEmployee.id,name,hourlyWage:wage,transportAllowance:transport,pin});closeEmployeeModal();alert(d.message);await Promise.all([loadAdminEmployees(),loadEmployees(),loadHistory()])}catch(e){$("empMsg").textContent=e.message}}'
          if old_save in s:
              s = s.replace(old_save, new_save, 1)

          old_buttons = '<button class="secondary" onclick="checkNetwork()">ネットワーク再確認</button><button class="secondary" onclick="checkStatus()">状態確認</button><button class="secondary" onclick="loadHistory()">打刻履歴更新</button><button class="primary" onclick="openAdminLogin()">管理者画面</button>'
          new_buttons = '<button id="checkNetworkBtn" class="secondary" type="button">ネットワーク再確認</button><button id="checkStatusBtn" class="secondary" type="button">状態確認</button><button id="loadHistoryBtn" class="secondary" type="button">打刻履歴更新</button><button id="openAdminBtn" class="primary" type="button">管理者画面</button>'
          if old_buttons in s:
              s = s.replace(old_buttons, new_buttons, 1)

          old_status = 'async function checkStatus(){try{const r=await fetch("/api/status",{cache:"no-store"}),d=await r.json();$("dbText").innerHTML=d.database?\'<span class="dbok">D1：接続OK（保存件数 \'+d.punchCount+\'件）</span>\':\'<span class="dbng">D1：未接続</span>\';log(JSON.stringify(d,null,2));}catch(e){log("APIエラー: "+e.message)}}'
          new_status = 'async function checkStatus(){try{const r=await fetch("/api/status",{cache:"no-store"}),d=await r.json();$("dbText").innerHTML=d.database?\'<span class="dbok">D1：接続OK（保存件数 \'+d.punchCount+\'件）</span>\':\'<span class="dbng">D1：未接続</span>\';log(d.database?"状態確認：正常\nD1接続OK・保存件数 "+d.punchCount+"件":"状態確認：D1未接続");}catch(e){log("状態確認エラー: "+e.message)}}'
          if old_status in s:
              s = s.replace(old_status, new_status, 1)

          marker_script = 'setPayrollMonth();\n(async()=>{await checkNetwork();await checkStatus();await loadEmployees();await loadHistory()})();'
          listener_script = 'setPayrollMonth();\ndocument.getElementById("checkNetworkBtn")?.addEventListener("click",checkNetwork);\ndocument.getElementById("checkStatusBtn")?.addEventListener("click",checkStatus);\ndocument.getElementById("loadHistoryBtn")?.addEventListener("click",loadHistory);\ndocument.getElementById("openAdminBtn")?.addEventListener("click",openAdminLogin);\n(async()=>{await checkNetwork();await checkStatus();await loadEmployees();await loadHistory()})();'
          if marker_script in s and 'checkNetworkBtn' not in s:
              s = s.replace(marker_script, listener_script, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Auto-fix staff name'
          git push
