name: Add staff name editing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Auto-fix staff name') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch staff name field
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')

          marker = '<div id="employeeModal" class="modalback"><div class="modal"><h2>スタッフ情報を編集</h2><div id="employeeInfo" class="notice"></div>'
          if 'id="empName"' not in s:
              if marker not in s:
                  raise SystemExit('employee modal marker not found')
              s = s.replace(marker, marker + '<div class="field"><label>名前</label><input id="empName" type="text" maxlength="50"></div>')

          s = re.sub(
              r'function openEmployee\(id\)\{.*?\}\nasync function saveEmployee',
              '''function openEmployee(id){editingEmployee=adminEmployees.find(x=>x.id===id);if(!editingEmployee)return;$("employeeInfo").textContent=`${editingEmployee.name}さんの設定`;$("empName").value=editingEmployee.name||"";$("empWage").value=editingEmployee.hourly_wage||0;$("empTransport").value=editingEmployee.transport_allowance||0;$("empPin").value="";$("empMsg").textContent="";$("employeeModal").classList.add("show")}\nasync function saveEmployee''',
              s,
              count=1,
              flags=re.S
          )

          s = re.sub(
              r'async function saveEmployee\(\)\{.*?\}\n',
              '''async function saveEmployee(){if(!editingEmployee)return;const name=$("empName").value.trim(),wage=Math.max(0,Math.floor(Number($("empWage").value||0))),transport=Math.max(0,Math.floor(Number($("empTransport").value||0))),pin=$("empPin").value.trim();if(!name){$("empMsg").textContent="名前を入力してください。";return}if(pin&&!/^\\d{4}$/.test(pin)){$("empMsg").textContent="PINは4桁の数字です。";return}$("empMsg").textContent="保存中…";try{const d=await adminPost("/api/admin/employee-update",{id:editingEmployee.id,name,hourlyWage:wage,transportAllowance:transport,pin});closeEmployeeModal();alert(d.message);await Promise.all([loadAdminEmployees(),loadEmployees(),loadHistory()])}catch(e){$("empMsg").textContent=e.message}}\n''',
              s,
              count=1,
              flags=re.S
          )

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Auto-fix staff name'
          git push
