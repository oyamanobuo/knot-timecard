name: Restore staff add delete UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Auto-restore staff UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore staff add and delete controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          
          heading = '<h3 class="section-title" style="margin-top:18px">スタッフ情報</h3><div id="adminEmployees"></div>'
          heading_new = '<h3 class="section-title" style="margin-top:18px">スタッフ情報</h3><div class="row" style="margin-bottom:10px"><button id="addEmployeeBtn" class="primary" type="button">＋ スタッフを追加</button></div><div id="adminEmployees"></div>'
          if 'id="addEmployeeBtn"' not in s:
              if heading not in s:
                  raise SystemExit('staff heading not found')
              s = s.replace(heading, heading_new, 1)
          
          modal = '''<div id="addEmployeeModal" class="modalback"><div class="modal"><h2>スタッフを追加</h2><div class="field"><label>名前</label><input id="newEmpName" type="text" maxlength="50" placeholder="例：鈴木"></div><div class="field"><label>時給（円）</label><input id="newEmpWage" type="number" min="0" step="1" value="0"></div><div class="field"><label>交通費（1勤務あたり・円）</label><input id="newEmpTransport" type="number" min="0" step="1" value="0"></div><div class="field"><label>PIN（4桁）</label><input id="newEmpPin" type="password" inputmode="numeric" maxlength="4" placeholder="例：5678"></div><div id="newEmpMsg" class="msg"></div><div class="row"><button id="saveNewEmployeeBtn" class="primary" type="button">追加する</button><button id="closeAddEmployeeBtn" class="secondary" type="button">キャンセル</button></div></div></div>'''
          if 'id="addEmployeeModal"' not in s:
              marker = '<div id="employeeModal" class="modalback">'
              if marker not in s:
                  raise SystemExit('employee modal marker not found')
              s = s.replace(marker, modal + '\n' + marker, 1)
          
          marker_script = '</script></body></html>'
          script = r'''<script>
(function(){
  function ensure(){
    const list=document.getElementById('adminEmployees');
    if(!list)return;
    const addBtn=document.getElementById('addEmployeeBtn');
    if(addBtn && !addBtn.dataset.bound){
      addBtn.dataset.bound='1';
      addBtn.addEventListener('click',function(){
        document.getElementById('newEmpName').value='';
        document.getElementById('newEmpWage').value='0';
        document.getElementById('newEmpTransport').value='0';
        document.getElementById('newEmpPin').value='';
        document.getElementById('newEmpMsg').textContent='';
        document.getElementById('addEmployeeModal').classList.add('show');
        setTimeout(()=>document.getElementById('newEmpName').focus(),50);
      });
    }
    const closeBtn=document.getElementById('closeAddEmployeeBtn');
    if(closeBtn && !closeBtn.dataset.bound){closeBtn.dataset.bound='1';closeBtn.addEventListener('click',()=>document.getElementById('addEmployeeModal').classList.remove('show'));}
    const saveBtn=document.getElementById('saveNewEmployeeBtn');
    if(saveBtn && !saveBtn.dataset.bound){saveBtn.dataset.bound='1';saveBtn.addEventListener('click',async function(){
      const name=document.getElementById('newEmpName').value.trim();
      const wage=Math.max(0,Math.floor(Number(document.getElementById('newEmpWage').value||0)));
      const transport=Math.max(0,Math.floor(Number(document.getElementById('newEmpTransport').value||0)));
      const pin=document.getElementById('newEmpPin').value.trim();
      const msg=document.getElementById('newEmpMsg');
      if(!name){msg.textContent='名前を入力してください。';return;}
      if(!/^\d{4}$/.test(pin)){msg.textContent='PINは4桁の数字です。';return;}
      msg.textContent='追加中…';
      try{const d=await adminPost('/api/admin/employee-create',{name,hourlyWage:wage,transportAllowance:transport,pin});document.getElementById('addEmployeeModal').classList.remove('show');alert(d.message);await Promise.all([loadAdminEmployees(),loadEmployees(),loadHistory(),checkStatus()]);}catch(e){msg.textContent=e.message;}
    });}
    if(typeof loadAdminEmployees==='function' && !loadAdminEmployees.__staffWrapped){
      const original=loadAdminEmployees;
      const wrapped=async function(){
        const result=await original.apply(this,arguments);
        const box=document.getElementById('adminEmployees');
        if(box && typeof adminEmployees!=='undefined'){
          box.innerHTML=(adminEmployees||[]).map(e=>'<div class="admin-card"><b>'+esc(e.name)+'</b><div class="small">時給：'+Number(e.hourly_wage||0).toLocaleString()+'円　交通費：'+Number(e.transport_allowance||0).toLocaleString()+'円／勤務　PIN：'+esc(e.pin||'')+'</div><div class="row" style="margin-top:8px"><button class="secondary editbtn" type="button" onclick="openEmployee(\''+esc(e.id).replace(/'/g,'&#39;')+'\')">編集</button><button class="danger editbtn" type="button" data-delete-id="'+esc(e.id)+'">削除</button></div></div>').join('');
          box.querySelectorAll('[data-delete-id]').forEach(function(btn){btn.addEventListener('click',async function(){const id=btn.getAttribute('data-delete-id');const emp=(adminEmployees||[]).find(x=>x.id===id);if(!emp)return;if(!confirm(emp.name+'さんをスタッフ一覧から削除しますか？\n\n過去の打刻履歴は残ります。'))return;try{const d=await adminPost('/api/admin/employee-delete',{id});alert(d.message);await Promise.all([loadAdminEmployees(),loadEmployees(),loadHistory(),checkStatus()]);}catch(e){alert(e.message);}});});
        }
        ensure();
        return result;
      };
      wrapped.__staffWrapped=true;
      window.loadAdminEmployees=wrapped;
    }
  }
  ensure();
  setInterval(ensure,1000);
})();
</script></script></body></html>'''
          if 'data-delete-id' not in s:
              if marker_script not in s:
                  raise SystemExit('script marker not found')
              s = s.replace(marker_script, script, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Auto-restore staff UI'
          git push
