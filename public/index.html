<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KNOT タイムカード</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#111;background:#f5f5f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:20px 14px 40px}h1{font-size:24px;margin:8px 0 4px}.sub{color:#666;font-size:13px;margin-bottom:18px}.panel{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000012}.status{display:flex;gap:8px;align-items:center;font-size:14px}.dot{width:10px;height:10px;border-radius:50%;background:#999}.ok{background:#20a05a}.ng{background:#d33}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.emp{border:1px solid #ddd;border-radius:14px;background:#fff;padding:18px 12px;text-align:center;cursor:pointer;font-size:19px}.emp small{display:block;color:#777;font-size:12px;margin-top:5px}.emp:disabled{opacity:.45;cursor:not-allowed}button{border:0;border-radius:12px;padding:12px 16px;font-size:16px;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#eee;color:#111}.row{display:flex;gap:8px;flex-wrap:wrap}.notice{font-size:12px;color:#777;line-height:1.6}.log{font-size:13px;color:#555;white-space:pre-wrap}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.in{color:#087f3e}.out{color:#a12}.dbok{color:#087f3e}.dbng{color:#a12}#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal{background:#fff;border-radius:18px;padding:20px;width:min(420px,100%)}.modal h2{margin-top:0}.pin{width:100%;font-size:28px;letter-spacing:8px;text-align:center;padding:12px;border:1px solid #ccc;border-radius:12px}.msg{min-height:20px;color:#b00020;font-size:13px;margin:8px 0}
</style></head><body><div class="wrap"><h1>KNOT タイムカード</h1><div class="sub">V1.2 テスト版・D1永続保存</div>
<div class="panel"><div class="status"><span id="dot" class="dot"></span><span id="networkText">ネットワーク確認中…</span></div><div id="ipText" class="notice" style="margin-top:8px"></div><div id="dbText" class="notice" style="margin-top:4px"></div></div>
<div class="panel"><h2 style="font-size:18px;margin-top:0">スタッフを選択</h2><div id="employees" class="grid"></div></div>
<div class="panel"><div class="row"><button class="secondary" onclick="checkNetwork()">ネットワーク再確認</button><button class="secondary" onclick="checkStatus()">状態確認</button><button class="secondary" onclick="loadHistory()">打刻履歴更新</button></div><div id="log" class="log" style="margin-top:12px"></div></div>
<div class="panel"><h2 style="font-size:18px;margin-top:0">最近の打刻</h2><div class="tablewrap"><table><thead><tr><th>日時</th><th>名前</th><th>区分</th></tr></thead><tbody id="history"><tr><td colspan="3">読み込み中…</td></tr></tbody></table></div></div>
<div class="panel notice"><b>V1.2</b><br>・店舗回線からのみ打刻可能<br>・スタッフごとに4桁PIN認証<br>・打刻データをCloudflare D1へ永続保存<br>・直近の打刻履歴を表示<br>・深夜時間計算はこの店舗では実装しません</div></div>
<div id="modal"><div class="modal"><h2 id="modalTitle">PIN入力</h2><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"><div id="msg" class="msg"></div><div class="row"><button class="primary" onclick="loginAndPunch()">打刻する</button><button class="secondary" onclick="closeModal()">キャンセル</button></div></div></div>
<script>
let employees=[],selected=null;const $=id=>document.getElementById(id);function log(t){$("log").textContent=new Date().toLocaleString("ja-JP")+"\n"+t}
async function checkNetwork(){try{const r=await fetch("/api/network",{cache:"no-store"}),d=await r.json();$("dot").className="dot "+(d.allowed?"ok":"ng");$("networkText").textContent=d.allowed?"店舗ネットワーク：OK":"店舗ネットワーク：NG";$("ipText").textContent=`検出IP: ${d.clientIp||"不明"}`;return d.allowed}catch(e){$("dot").className="dot ng";$("networkText").textContent="ネットワーク確認API未接続";return false}}
async function checkStatus(){try{const r=await fetch("/api/status",{cache:"no-store"}),d=await r.json();$("dbText").innerHTML=d.database?'<span class="dbok">D1：接続OK（保存件数 '+d.punchCount+'件）</span>':'<span class="dbng">D1：未接続</span>';log(JSON.stringify(d,null,2));}catch(e){log("APIエラー: "+e.message)}}
async function loadEmployees(){try{const r=await fetch("/api/employees",{cache:"no-store"}),d=await r.json();if(!d.ok)throw Error(d.message);employees=d.employees;$("employees").innerHTML=employees.map(e=>`<button class="emp" onclick="openModal('${e.id}')">${e.name}<small>タップして打刻</small></button>`).join("");}catch(e){$("employees").innerHTML='<div class="notice">スタッフ情報を取得できません。</div>'}}
function openModal(id){selected=employees.find(e=>e.id===id);$("modalTitle").textContent=selected.name+"さんのPIN";$("pin").value="";$("msg").textContent="";$("modal").style.display="flex";setTimeout(()=>$("pin").focus(),50)}function closeModal(){selected=null;$("modal").style.display="none"}
async function loginAndPunch(){if(!selected)return;const pin=$("pin").value.trim();if(!/^\d{4}$/.test(pin)){$("msg").textContent="4桁のPINを入力してください。";return}$('msg').textContent="確認中…";try{const a=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({employeeId:selected.id,pin})}).then(r=>r.json());if(!a.ok){$("msg").textContent=a.message||"認証できませんでした。";return}const p=await fetch("/api/punch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({employeeId:selected.id})}).then(r=>r.json());if(!p.ok){$("msg").textContent=p.message||"打刻できませんでした。";return}const employeeName=selected.name; const punchLabel=p.type==='in'?"出勤":"退勤"; closeModal(); log(`${employeeName}：${punchLabel} ${new Date(p.timestamp).toLocaleString("ja-JP")}`); alert(`${employeeName}さん\n${punchLabel}を記録しました。`); await loadHistory(); await checkStatus()}catch(e){$("msg").textContent="通信エラー: "+e.message}}
async function loadHistory(){try{const r=await fetch("/api/history?limit=30",{cache:"no-store"}),d=await r.json();if(!d.ok)throw Error(d.message);$("history").innerHTML=d.rows.length?d.rows.map(x=>`<tr><td>${new Date(x.timestamp).toLocaleString("ja-JP")}</td><td>${x.name}</td><td class="${x.type}">${x.type==='in'?"出勤":"退勤"}</td></tr>`).join(""): '<tr><td colspan="3">まだ打刻はありません。</td></tr>'}catch(e){$("history").innerHTML='<tr><td colspan="3">履歴を取得できません。</td></tr>'}}
(async()=>{await checkNetwork();await checkStatus();await loadEmployees();await loadHistory()})();
</script></body></html>
